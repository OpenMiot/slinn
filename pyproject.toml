[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "slinn"
version = "2.3.6"
description = "An HTTP server framework"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Mark Radin", email = "openmiot@gmail.com" }]
urls = { Homepage = "https://wiki.miot.su/slinn" }

[project.scripts]
slinn-admin = "slinn.scripts.slinn_admin:main"
slinn       = "slinn.scripts.slinn:main"
spm         = "slinn.scripts.spm:main"

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
exclude = ["t*", "venv*", "Writerside*", "build*"]
