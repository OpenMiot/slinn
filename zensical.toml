[project]
#site_url = 'https://www.example.com/'
site_name = 'Slinn Flux'
# site_description = "Your project description"
ite_author = 'Mark Radin, Miot Project'

copyright = 'Copyright &copy; 2026 Miot Project'

repo_url = 'https://github.com/OpenMiot/slinn'
# repo_name = "user/repo"
# edit_uri = "edit/main/docs/"

nav = [
  { 'Главная' = 'index.md' },
  { 'Быстрый старт' = [
      'Быстрый-старт/index.md',
      'Быстрый-старт/Приступая-к-работе.md',
      'Быстрый-старт/Простой-пример.md',
    ]
  },
]

# extra_css = ["stylesheets/extra.css"]
# extra_javascript = ["javascripts/extra.js"]

[project.theme]
# variant = "classic"
# custom_dir = "overrides"
favicon = 'assets/slinn_logo_transparent.png'
language = 'ru'
features = [
  "announce.dismiss",
  # "content.action.edit",
  # "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  # "header.autohide",
  # "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.path",
  "navigation.prune",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  # "toc.follow",
  "toc.integrate",
]

logo = 'assets/slinn_logo_transparent.png'

# [project.theme.icon]
# logo = "lucide/smile"

[project.theme.font]
text = 'Ubuntu'
code = 'Firacode'

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"
primary="purple"
accent="purple"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"
primary="purple"
accent="purple"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"
primary="purple"
accent="purple"

[[project.extra.social]]
icon = 'fontawesome/brands/github'
link = 'https://github.com/OpenMiot/slinn'

[[project.extra.social]]
icon = 'fontawesome/brands/telegram'
link = 'https://t.me/miotch'

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc = {
  permalink = true
}
pymdownx.arithmatex = {
  generic = true
}
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji = {
  emoji_generator = "zensical.extensions.emoji.to_svg",
  emoji_index = "zensical.extensions.emoji.twemoji",
}
pymdownx.highlight = {
  anchor_linenums = true,
  line_spans = "__span",
  pygments_lang_class = true,
}
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# pymdownx.snippets = {
#   base_path = "includes",
# }
pymdownx.superfences = {
  custom_fences = [
    {
      name = "mermaid",
      class = "mermaid",
      format = "pymdownx.superfences.fence_code_format",
    },
  ],
}
pymdownx.tabbed = {
  alternate_style = true,
  combine_header_slug = true
}
pymdownx.tasklist = {
  custom_checkbox = true
}
pymdownx.tilde = {}
